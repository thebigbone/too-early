<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const key = "too-early-theme";
          const stored = localStorage.getItem(key);
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#0b0b0b" : "#ffffff");
        } catch {
          // default to the light theme
        }
      })();
    </script>
    <meta
      name="description"
      content="An interactive chart of Too Early's Hacker News confidence archive: wrong calls, right calls, years, and categories."
    />
    <meta property="og:title" content="Charts — Too Early" />
    <meta
      property="og:description"
      content="An interactive data portrait of Hacker News' most confident wrong calls and right calls."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thebigbone.github.io/too-early/charts/" />
    <meta property="og:image" content="https://thebigbone.github.io/too-early/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Charts — Too Early" />
    <meta
      name="twitter:description"
      content="An interactive data portrait of Hacker News' most confident wrong calls and right calls."
    />
    <link rel="canonical" href="https://thebigbone.github.io/too-early/charts/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Charts — Too Early</title>
  </head>
  <body>
    <div id="chart-root"></div>
    <script type="module" src="/src/charts-main.tsx"></script>
  </body>
</html>
